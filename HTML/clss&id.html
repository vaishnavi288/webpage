<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    /* for all p */
    p{
        color:brown;
    }
 
    /* element with id i*/

   #i{
     color:cadetblue;
   }

   /* element with class p */
   
   .p{
    text-align:center;
   }

</style>

</head>
<body>
    <h1 id="i">CLASS AND ID</h1>
    <p>paragraph1</p>
    <p class="p">paragraph2</p>
    <p>paragraph3</p>
    <p class="p">paragraph4</p>
    <p>paragraph5</p>
</body>
</html>
