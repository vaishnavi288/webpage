<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        table {
            width: 50%;
        }

        table,
        th,
        td {
            border: 2px solid rgb(145, 16, 16);
            border-collapse: collapse;
            padding: 10px;


        }
    </style>
</head>

<body>
    <h1>TABLE CREATION</h1>
    <table>
        <tr>
            <th>
                name
            </th>
            <th>
                age
            </th>
            <th>
                place
            </th>
        </tr>

        <tr>
            <td>Arun</td>
            <td>23</td>
            <td>EKM</td>
        </tr>

        <tr>
            <td>Amal</td>
            <td>22</td>
            <td>TVM</td>
        </tr>
    </table>

<!-- second table -->


    <h2> rowsapan and colspan</h2>
    <table>
        <tr>
            <th>
                name
            </th>
            <th colspan="2">phone</th>
            <th>age</th>
        </tr>

        <tr>
            <td>Arun</td>
            <td>1234</td>
            <td>4567</td>
            <td>23</td>
        </tr>

        <tr>
            <td>Amal</td>
            <td>3456</td>
            <td>6789</td>
            <td>25</td>
        </tr>
    </table>

</body>

</html>
