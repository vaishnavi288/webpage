<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
           border:5px solid red;
           height:200px;
           border-radius:5px;
        }
        h1{
            border:2px dotted black;
        }
        p{
            border-left:2px double blueviolet;
        }
        h2{
            border:2px dashed black;
        }
    </style>
</head>
<body>
    <h1>border-property</h1>
    <p>
        hi all
    </p>
    <h2>
        border dashed
    </h2>
    <div>
        hello
    </div>
</body>
</html>
