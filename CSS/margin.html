<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

      div{
           border:5px solid red;
           height:200px;
           border-radius:5px;
           margin:100px;
        }
        h1{
            border:2px dotted black;
            margin-left:100px;
        }
         p{
            border-left:2px double blueviolet;
            margin:auto;
        }
    
        h2{
            border:2px dashed black;
            margin-left:auto;
        }
        /* margin all side */
        /* for specific side left,right,top,bottom
        auto to center horizontaly
        left,right shift to right and left */
        </style>
</head>
<body>
    <h1>border-property</h1>
    
    <div>
        hello
    </div>
      <p>
        hi all
    </p>
    <h2>
        border dashed
    </h2>
</body>
</html>
