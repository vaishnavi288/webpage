<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body class="container bg-secondary text-light fs-3">
    <div class="container w-50">
        <form>
            <div class="mt-3">
                <label class="form-label">username</label>
                <input type="text" class="form-control" placeholder="enter your name">
            </div>
            <div class="mt-3">
                <label class="form-label">password</label>
                <input type="password" class="form-control">
            </div>
            <div class="mt-3">
                <label class="form-label">address</label>
                <textarea rows="5" class="form-control rows=10">write your address</textarea>
            </div>
            <div class="mt-3">
                <label>hobies</label><br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="inlineCheckbox1" value="option1">
                    <label class="form-check-label" for="inlineCheckbox1">sports</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="inlineCheckbox2" value="option2">
                    <label class="form-check-label" for="inlineCheckbox2">music</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="inlineCheckbox3" value="option3">
                    <label class="form-check-label" for="inlineCheckbox3">travel</label>
                </div>
            </div>
            <div class="mt-3">
                <label>gender</label>
                <br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1"
                        value="option1">
                    <label class="form-check-label" for="inlineRadio1">female</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2"
                        value="option2">
                    <label class="form-check-label" for="inlineRadio2">male</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio3"
                        value="option3">
                    <label class="form-check-label" for="inlineRadio3">others</label>
                </div>
            </div>

            <div class="mt-3">
                <label>qualification</label><br>
                <select class="form-select" aria-label="Default select example">
                    <option selected>Open this select menu</option>
                    <option value="1">bba</option>
                    <option value="2">bca</option>
                    <option value="3">btech</option>
                </select>

            </div>


            <div class="mt-3">
                <input type="submit" class="btn btn-primary">
            </div>
    </div>




    </form>

    </div>

</body>

</body>

</html>
